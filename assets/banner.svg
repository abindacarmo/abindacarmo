<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E0A2E"/>
      <stop offset="50%" stop-color="#220D1C"/>
      <stop offset="100%" stop-color="#1A0E28"/>
    </linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E91E8C" stop-opacity="0"/>
      <stop offset="40%" stop-color="#E91E8C" stop-opacity="1"/>
      <stop offset="65%" stop-color="#9C27B0" stop-opacity="1"/>
      <stop offset="100%" stop-color="#9C27B0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#9C27B0" stop-opacity="0"/>
      <stop offset="50%" stop-color="#E91E8C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E91E8C" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="14"/>

  <!-- Top & bottom accent lines -->
  <rect x="0" y="0" width="800" height="2" fill="url(#tl)"/>
  <rect x="0" y="198" width="800" height="2" fill="url(#bl)"/>

  <!-- Left accent bars -->
  <rect x="36" y="34" width="2.5" height="38" fill="#E91E8C" opacity="0.85" rx="1"/>
  <rect x="36" y="76" width="2.5" height="42" fill="#9C27B0" opacity="0.65" rx="1"/>

  <!-- Corner brackets -->
  <polyline points="768,10 790,10 790,32" fill="none" stroke="#E91E8C" stroke-width="1.2" opacity="0.6"/>
  <polyline points="32,190 10,190 10,168" fill="none" stroke="#9C27B0" stroke-width="1.2" opacity="0.6"/>

  <!-- Floating code icons with SVG animate -->
  <text x="350" y="150" font-family="Courier New, monospace" font-size="12" fill="#E91E8C" opacity="0.35" transform="rotate(-8,30,50)">&lt;/&gt;
    <animate attributeName="y" values="50;38;50" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.35;0.6;0.35" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="480" y="160" font-family="Courier New, monospace" font-size="11" fill="#CE93D8" opacity="0.3" transform="rotate(6,80,160)">{  }
    <animate attributeName="y" values="160;148;160" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.55;0.3" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="18" y="100" font-family="Courier New, monospace" font-size="10" fill="#F48FB1" opacity="0.28">def
    <animate attributeName="y" values="100;90;100" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.5;0.28" dur="3.5s" repeatCount="indefinite"/>
  </text>
  <text x="120" y="35" font-family="Courier New, monospace" font-size="11" fill="#E91E8C" opacity="0.32" transform="rotate(5,120,35)">fn()
    <animate attributeName="y" values="35;24;35" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.32;0.58;0.32" dur="4.5s" repeatCount="indefinite"/>
  </text>
  <text x="60" y="80" font-family="Courier New, monospace" font-size="10" fill="#CE93D8" opacity="0.3" transform="rotate(-5,60,80)">git
    <animate attributeName="y" values="80;70;80" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.52;0.3" dur="6s" repeatCount="indefinite"/>
  </text>
  <text x="350" y="170" font-family="Courier New, monospace" font-size="11" fill="#F48FB1" opacity="0.28" transform="rotate(-7,170,170)">sql
    <animate attributeName="y" values="170;158;170" dur="3.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.5;0.28" dur="3.8s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="160" font-family="Courier New, monospace" font-size="10" fill="#E91E8C" opacity="0.3" transform="rotate(4,210,28)">&amp;&amp;
    <animate attributeName="y" values="28;18;28" dur="5.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.55;0.3" dur="5.2s" repeatCount="indefinite"/>
  </text>
  <text x="400" y="160" font-family="Courier New, monospace" font-size="10" fill="#CE93D8" opacity="0.28">[ ]
    <animate attributeName="y" values="110;100;110" dur="4.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.5;0.28" dur="4.2s" repeatCount="indefinite"/>
  </text>
  <text x="240" y="150" font-family="Courier New, monospace" font-size="11" fill="#F48FB1" opacity="0.3" transform="rotate(6,240,150)">=&gt;
    <animate attributeName="y" values="150;140;150" dur="3.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.55;0.3" dur="3.3s" repeatCount="indefinite"/>
  </text>
  <text x="700" y="125" font-family="Courier New, monospace" font-size="10" fill="#E91E8C" opacity="0.28" transform="rotate(-4,100,125)">php
    <animate attributeName="y" values="125;115;125" dur="4.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.52;0.28" dur="4.8s" repeatCount="indefinite"/>
  </text>
  <text x="600" y="55" font-family="Courier New, monospace" font-size="10" fill="#CE93D8" opacity="0.3" transform="rotate(7,280,55)">for
    <animate attributeName="y" values="55;44;55" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.55;0.3" dur="5.5s" repeatCount="indefinite"/>
  </text>
  <text x="550" y="175" font-family="Courier New, monospace" font-size="11" fill="#E91E8C" opacity="0.28" transform="rotate(-6,320,175)">★
    <animate attributeName="y" values="175;163;175" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.55;0.28" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="650" y="30" font-family="Courier New, monospace" font-size="12" fill="#F48FB1" opacity="0.3" transform="rotate(5,350,30)">&lt;/&gt;
    <animate attributeName="y" values="30;19;30" dur="3.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.56;0.3" dur="3.6s" repeatCount="indefinite"/>
  </text>
  <text x="750" y="165" font-family="Courier New, monospace" font-size="10" fill="#CE93D8" opacity="0.28" transform="rotate(-5,400,165)">int
    <animate attributeName="y" values="165;154;165" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.5;0.28" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="330" y="165" font-family="Courier New, monospace" font-size="10" fill="#E91E8C" opacity="0.28">py
    <animate attributeName="y" values="45;34;45" dur="4.3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.28;0.52;0.28" dur="4.3s" repeatCount="indefinite"/>
  </text>

  <!-- Greeting -->
  <text x="50" y="62" font-family="Courier New, monospace" font-size="11" fill="#CE93D8" letter-spacing="3">HI THERE &#x2736; I'M</text>

  <!-- Main name -->
  <text x="48" y="118" font-family="Georgia, serif" font-size="52" font-weight="bold" fill="#FAF0FF" letter-spacing="1">Brig<tspan fill="#E91E8C">ida</tspan><tspan font-size="44" fill="#9C27B0">.</tspan></text>

  <!-- Tagline -->
  <text x="50" y="143" font-family="Courier New, monospace" font-size="12" fill="#CE93D8">Web dev <tspan fill="#7B4F8E">&#x2192;</tspan> <tspan fill="#F48FB1">Data Engineer</tspan> <tspan fill="#7B4F8E">in progress</tspan></text>

  <!-- Divider line -->
  <line x1="50" y1="155" x2="500" y2="155" stroke="#3a1050" stroke-width="1"/>

  <!-- Skill pills -->
  <rect x="50"  y="163" width="44" height="22" rx="11" fill="#2e0e3e" stroke="#9C27B0" stroke-width="0.8"/>
  <text x="72"  y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#E1BEE7">PHP</text>

  <rect x="100" y="163" width="44" height="22" rx="11" fill="#2e0e3e" stroke="#9C27B0" stroke-width="0.8"/>
  <text x="122" y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#E1BEE7">SQL</text>

  <rect x="150" y="161" width="60" height="26" rx="13" fill="#300618" stroke="#E91E8C" stroke-width="1.2"/>
  <text x="180" y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#F48FB1">Python &#x2736;</text>

  <rect x="216" y="163" width="50" height="22" rx="11" fill="#2e0e3e" stroke="#9C27B0" stroke-width="0.8"/>
  <text x="241" y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#E1BEE7">Kotlin</text>

  <rect x="272" y="163" width="36" height="22" rx="11" fill="#2e0e3e" stroke="#9C27B0" stroke-width="0.8"/>
  <text x="290" y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#E1BEE7">Git</text>

  <rect x="314" y="163" width="50" height="22" rx="11" fill="#2e0e3e" stroke="#9C27B0" stroke-width="0.8"/>
  <text x="339" y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#E1BEE7">Linux</text>

  <rect x="370" y="161" width="80" height="26" rx="13" fill="#300618" stroke="#E91E8C" stroke-width="1.2"/>
  <text x="410" y="178" text-anchor="middle" font-family="Courier New, monospace" font-size="10" fill="#F48FB1">Data Eng. &#x2197;</text>

  <!-- Status pulse dot -->
  <circle cx="700" cy="178" r="5" fill="#E91E8C">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;3.5;5" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="710" y="182" font-family="Courier New, monospace" font-size="10" fill="#F48FB1">always learning</text>
</svg>